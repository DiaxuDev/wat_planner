[workspace]
members = [ "crates/*" ]
resolver = "3"

[workspace.package]
name = "wat_planner"
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
wat-parser.path = "crates/wat-parser"

chrono = "0.4.45"
clap = { features = [ "derive" ], version = "4.6.7" }
jni = "0.22.4"
reqwest = { features = [ "blocking", "cookies", "gzip", "deflate" ], version = "0.13.5" }
scraper = "0.27.0"
serde = { features = [ "derive" ], version = "1.0.229" }
serde_json = "1.0.151"
tera = { features = [ "fast" ], version = "2.4.0" }
thiserror = "2.0.21"
yansi = "1.0.1"

[workspace.lints.clippy]
complexity = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

missing_errors_doc = "allow"
must_use_candidate = "allow"
panic = "deny"
unwrap_used = "deny"
